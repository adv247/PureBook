name: Build APK

# Every push to main builds a signed release APK and publishes it as a
# GitHub release (v1.2.<n>, see the Version step).
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'fastlane/**'
      - 'assets/**'
      - '.github/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle

      # 1.2.<n>: this repo's run numbers restarted at 1, so offset by +4
      # (run 3 -> 1.2.7, run 5 -> 1.2.9). Never goes negative.
      - name: Version
        run: echo "VERSION=1.2.$(( ${{ github.run_number }} + 4 ))" >> "$GITHUB_ENV"

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PversionNameOverride=$VERSION

      - name: Sign APK
        run: |
          echo "${{ secrets.KEYSTORE_FILE }}" | base64 --decode > "$RUNNER_TEMP/keystore.jks"
          APKSIGNER=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -n 1)apksigner
          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/keystore.jks" \
            --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
            --ks-pass pass:${{ secrets.KEYSTORE_PASSWORD }} \
            --key-pass pass:${{ secrets.KEY_PASSWORD }} \
            --out PureBook.apk \
            app/build/outputs/apk/release/app-release.apk
          rm -f "$RUNNER_TEMP/keystore.jks"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v$VERSION PureBook.apk \
            --title "PureBook v$VERSION" \
            --generate-notes --target "${{ github.sha }}"
